<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LVS Mall — Homepage</title>
<meta name="description" content="LVS Mall, New Airport Road, Chikkajala, Bengaluru: 32 brands across fashion, sport, footwear, ethnic wear, home and food. Open 10 AM to 10 PM.">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&family=Noto+Sans+Kannada:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF8F4}
a{color:#1D3148;text-decoration:none}a:hover{color:#8B6347}
.wrap{max-width:1280px;margin:0 auto;padding:0 48px;box-sizing:border-box}
@media (max-width:760px){.wrap{padding:0 20px}}
</style>
<style>html{scroll-behavior:smooth}</style>
</head>
<body>
<div id="app"></div>
<template data-dc="Main"><div style="font-family: Inter, system-ui, sans-serif; color: #1D3148; background: #FBF8F4; width: 100%">

<div style="background: #15243A; color: #C9CFD8; font-size: 13px">
<div class="wrap" style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding-top: 10px; padding-bottom: 10px">
<span>Open today · 10 AM – 10 PM</span>
<span>New Airport Road, Chikkajala, Bengaluru</span>
</div>
</div>


<header style="border-bottom: 1px solid #E6DDD2; background: #FBF8F4; position: relative; z-index: 2">
<div class="wrap" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; padding-top: 16px; padding-bottom: 16px">
<a href="#top" style="display: flex; align-items: center; gap: 14px">
<img src="assets/images/lvs-mark-navy.png" alt="" style="height: 48px; width: auto">
<span style="font-size: 22px; letter-spacing: 0.08em">LVS MALL</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 32px; font-size: 15px; font-weight: 500">
<a href="#directory">Brands</a><a href="#map">Mall map</a><a href="#amenities">Amenities</a><a href="#visit">Getting here</a><a href="business.html">For business</a><a href="contact.html">Contact</a>
</nav>
<a href="#visit" style="background: #1D3148; color: #FBF8F4; padding: 13px 24px; font-size: 14px; font-weight: 500; border-radius: 999px">Get directions</a>
</div>
</header>

<section id="top" style="position: relative; min-height: 680px; display: flex; align-items: flex-end; color: #FBF8F4; background: #15243A">
<img src="assets/images/hero-aerial-dusk.jpg" alt="Aerial view of LVS Mall at dusk, with parking in front of the store blocks" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,36,58,0.15) 0%, rgba(21,36,58,0.35) 45%, rgba(21,36,58,0.92) 100%)"></div>
<div class="wrap" style="position: relative; width: 100%; padding-top: 160px; padding-bottom: 72px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 40px">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<span style="font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #CAA189">Chikkajala · On the airport road</span>
<h1 style="margin: 0; font-family: 'Crimson Pro', serif; font-weight: 400; font-size: 96px; line-height: 0.95">Lifestyle. <span style="font-style: italic; color: #CAA189">Luxury.</span> Lounge.</h1>
<span lang="kn" style="font-family: 'Noto Sans Kannada', sans-serif; font-size: 22px; color: #CAA189">ಎಲ್ ವಿ ಎಸ್ ಮಾಲ್</span>
</div>
<div style="flex: 0 1 380px; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #E3E7ED">32 brands across fashion, sport, footwear and home, plus a McDonald's drive-thru — with parking right outside every store.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="#directory" style="background: #CAA189; color: #1D3148; padding: 15px 26px; border-radius: 999px; font-weight: 600; font-size: 15px">Explore brands</a>
<a href="#map" style="border: 1px solid rgba(251,248,244,0.6); color: #FBF8F4; padding: 15px 26px; border-radius: 999px; font-weight: 500; font-size: 15px">Mall map</a>
</div>
</div>
</div>
</section>

<section id="categories" style="padding: 96px 0">
<div class="wrap" style="display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 12px"><span style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #8B6347">The LVS experience</span><h2 style="margin: 0; font-family: 'Crimson Pro', serif; font-weight: 400; font-size: 56px; line-height: 1">Shop by category</h2></div>
<p style="margin: 0; max-width: 460px; font-size: 16px; line-height: 1.6; color: #5B6170">Big-name brands in easy, open-air storefronts. Park outside, walk in, and you're shopping — no long corridors, no basement parking.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<a href="#directory" onClick="{{c.pick}}" style="position: relative; height: 380px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 18px; padding: 22px 18px 26px; box-sizing: border-box; overflow: hidden; background: #1D3148; color: #FBF8F4; border: 1px solid #2E4260">
<span style="position: absolute; left: 18px; right: 18px; top: 18px; bottom: 104px; border: 1px solid rgba(202,161,137,0.55); border-radius: 999px 999px 0 0"></span>
<span style="position: absolute; left: 26px; right: 26px; top: 26px; bottom: 112px; border: 1px solid rgba(202,161,137,0.2); border-radius: 999px 999px 0 0"></span>
<svg viewBox="0 0 120 120" aria-hidden="true" style="position: absolute; left: 50%; top: 52px; width: 124px; height: 124px; transform: translateX(-50%); overflow: visible"><path d="{{c.art}}" fill="none" stroke="#CAA189" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center"><span style="width: 28px; height: 1px; background: #CAA189"></span><span style="font-family: 'Crimson Pro', serif; font-size: 28px; line-height: 1.05">{{c.label}}</span><span style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #CAA189">{{c.count}}</span></span>
</a>
</sc-for>
</div>
</div>
</section>

<section aria-label="LVS Mall at a glance" style="position: relative; color: #FBF8F4; background: #15243A">
<img src="assets/images/access-highway-night.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(21,36,58,0.88) 0%, rgba(21,36,58,0.6) 55%, rgba(21,36,58,0.35) 100%)"></div>
<div class="wrap" style="position: relative; padding-top: 96px; padding-bottom: 96px; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 640px"><span style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #CAA189">Access &amp; connectivity</span><h2 style="margin: 0; font-family: 'Crimson Pro', serif; font-weight: 400; font-size: 56px; line-height: 1.02">Shopping made easy, right on New Airport Road</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 32px; border-top: 1px solid rgba(202,161,137,0.4); padding-top: 32px">
<div><div style="font-family: 'Crimson Pro', serif; font-size: 64px; line-height: 1; color: #CAA189">32</div><div style="font-size: 15px; margin-top: 8px; color: #E3E7ED">brands, now open</div></div>
<div><div style="font-family: 'Crimson Pro', serif; font-size: 64px; line-height: 1; color: #CAA189">2</div><div style="font-size: 15px; margin-top: 8px; color: #E3E7ED">floors in most stores</div></div>
<div><div style="font-family: 'Crimson Pro', serif; font-size: 64px; line-height: 1; color: #CAA189">P</div><div style="font-size: 15px; margin-top: 8px; color: #E3E7ED">parking outside every store</div></div>
<div><div style="font-family: 'Crimson Pro', serif; font-size: 64px; line-height: 1; color: #CAA189">1</div><div style="font-size: 15px; margin-top: 8px; color: #E3E7ED">McDonald's drive-thru</div></div>
</div>
</div>
</section>

<section id="amenities" style="padding: 96px 0; border-bottom: 1px solid #E6DDD2">
<div class="wrap" style="display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 12px"><span style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #8B6347">Services</span><h2 style="margin: 0; font-family: 'Crimson Pro', serif; font-weight: 400; font-size: 56px; line-height: 1">Amenities</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<sc-for list="{{amenities}}" as="a" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 16px; padding: 20px; border: 1px solid #E6DDD2; background: #FFFFFF">
<span style="width: 48px; height: 48px; flex: none; border-radius: 999px; background: #F3ECE4; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D3148" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"/></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{a.label}}</span><span style="font-size: 13px; color: #5B6170">{{a.note}}</span></span>
</div>
</sc-for>
</div>
</div>
</section>

<section id="directory" style="background: #F3ECE4; padding: 96px 0">
<div class="wrap" style="display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #8B6347">Now open</span>
<h2 style="margin: 0; font-family: 'Crimson Pro', serif; font-weight: 400; font-size: 60px; line-height: 1">Our brands</h2>
</div>
<div role="group" aria-label="Filter by category" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px">
<sc-for list="{{stores}}" as="s" hint-placeholder-count="31">
<a href="#map" onClick="{{s.pick}}" aria-label="{{s.aria}}" style="background: #FFFFFF; border: 1px solid #E6DDD2; display: flex; flex-direction: column">
<div style="height: 120px; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; border-bottom: 1px solid #EFE6DB">
<sc-if value="{{s.hasLogo}}" hint-placeholder-val="{{ false }}"><img src="{{s.logo}}" alt="" style="max-height: 60px; max-width: 150px; width: auto; height: auto"></sc-if>
<sc-if value="{{s.noLogo}}" hint-placeholder-val="{{ true }}"><span style="font-size: 17px; font-weight: 600; letter-spacing: 0.04em; text-align: center; text-transform: uppercase">{{s.name}}</span></sc-if>
</div>
<div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; font-size: 13px"><span style="color: #1D3148; font-weight: 500">{{s.meta}}</span><span style="color: #5B6170">{{s.cat}}</span></div>
</a>
</sc-for>
</div>
</div>
</section>

<section id="map" style="padding: 96px 0">
<div style="margin: 0 auto; padding: 0 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; padding: 0 16px">
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #8B6347">Find your store</span>
<h2 style="margin: 0; font-family: 'Crimson Pro', serif; font-weight: 400; font-size: 60px; line-height: 1">Mall map</h2>
</div>
<p style="margin: 0; font-size: 15px; color: #5B6170; max-width: 420px">Search a brand, pick a category or switch floors.</p>
</div>
<div style="border: 1px solid #E6DDD2; background: #FFFFFF">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid #EFE6DB; position: relative; z-index: 5">
<div style="position: relative; flex: 0 1 320px; min-width: 240px">
<label style="display: flex; align-items: center; gap: 10px; height: 46px; border: 1px solid #D8CBBB; padding: 0 14px; background: #FBF8F4">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6170" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input type="search" placeholder="Search a brand" aria-label="Search a brand" value="{{q}}" onInput="{{onQ}}" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 400 15px Inter, sans-serif; color: #1D3148; outline: none">
</label>
<sc-if value="{{showResults}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 50px; max-height: 320px; overflow-y: auto; background: #FFFFFF; border: 1px solid #D8CBBB; box-shadow: 0 12px 30px rgba(29,49,72,0.15)">
<sc-for list="{{mlist}}" as="m" hint-placeholder-count="5">
<button type="button" onClick="{{m.pickClear}}" style="{{m.style}}"><span style="{{m.dot}}"></span><span style="display: flex; flex-direction: column; gap: 2px; text-align: left; min-width: 0"><span style="font-size: 15px; font-weight: 600">{{m.name}}</span><span style="font-size: 12px; color: #5B6170">{{m.meta}}</span></span></button>
</sc-for>
<sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 16px 20px; font-size: 14px; color: #5B6170">No brand matches that search.</p></sc-if>
</div>
</sc-if>
</div>
<div role="group" aria-label="Category" style="display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 420px">
<sc-for list="{{mcats}}" as="c" hint-placeholder-count="7">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}"><span style="{{c.dot}}"></span>{{c.label}}</button>
</sc-for>
</div>
<div role="tablist" aria-label="Floor" style="display: flex; gap: 4px; background: #F3ECE4; padding: 4px; border-radius: 999px">
<sc-for list="{{floors}}" as="f" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 10px 20px; font-size: 13px; color: #5B6170; border-bottom: 1px solid #EFE6DB"><span>{{floorNote}} · Tap a store to see its details</span>
<div role="group" aria-label="Zoom" style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Zoom out" onClick="{{zoomOut}}" style="width: 38px; height: 38px; border: 1px solid #D8CBBB; background: #FFFFFF; border-radius: 999px; font: 500 18px Inter, sans-serif; color: #1D3148; cursor: pointer; display: flex; align-items: center; justify-content: center">−</button>
<span style="min-width: 48px; text-align: center; font-weight: 600; color: #1D3148">{{zoomLabel}}</span>
<button type="button" aria-label="Zoom in" onClick="{{zoomIn}}" style="width: 38px; height: 38px; border: 1px solid #D8CBBB; background: #FFFFFF; border-radius: 999px; font: 500 18px Inter, sans-serif; color: #1D3148; cursor: pointer; display: flex; align-items: center; justify-content: center">+</button>
<button type="button" onClick="{{zoomFit}}" style="height: 38px; padding: 0 14px; border: 1px solid #D8CBBB; background: #FFFFFF; border-radius: 999px; font: 500 13px Inter, sans-serif; color: #1D3148; cursor: pointer">Fit</button>
</div></div>
<div style="{{mapBox}}">
<div style="{{mapOuter}}">
<div style="{{mapInner}}">
<dc-import name="MallMap" selected="{{selected}}" floor="{{floor}}" cat="{{mcat}}" sel-info="{{selInfoMap}}" logo="{{selLogo}}" on-pick="{{onPick}}" hint-size="1180px,720px"></dc-import>
</div>
</div>
</div>
</div>
</div>
</section>

<section id="visit" style="background: #1D3148; color: #FBF8F4; padding: 96px 0">
<div class="wrap" style="display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-wrap: wrap; gap: 56px">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 12px"><span style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #CAA189">Plan your visit</span><h2 style="margin: 0; font-family: 'Crimson Pro', serif; font-weight: 400; font-size: 56px; line-height: 1">Getting here</h2></div>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #C9CFD8">LVS Mall sits on New Airport Road at Chikkajala, on the way to Kempegowda International Airport — an easy stop on the way to or from a flight.</p>
<div style="display: flex; flex-direction: column; gap: 18px; font-size: 15px; line-height: 1.6">
<div><div style="color: #CAA189; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase">Address</div>LVS Mall, New Airport Road, Chikkajala, Bengaluru 562157</div>
<div><div style="color: #CAA189; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase">Hours</div>10 AM – 10 PM, all week</div>
<div><div style="color: #CAA189; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase">Contact</div><a href="contact.html" style="color: #FBF8F4; text-decoration: underline">Send us a message</a> — it goes straight to the mall office.</div>
</div>
<a href="https://maps.app.goo.gl/fNzRHLnb3qc2J7Xc8" style="align-self: flex-start; background: #CAA189; color: #1D3148; padding: 15px 26px; border-radius: 999px; font-weight: 600; font-size: 15px">Get directions</a>
</div>
<a href="https://maps.app.goo.gl/fNzRHLnb3qc2J7Xc8" style="flex: 1 1 520px; min-width: 0; min-height: 400px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 28px; box-sizing: border-box; background: #263C57; border: 1px solid #3A5170; color: #FBF8F4; background-image: radial-gradient(circle at 50% 42%, rgba(202,161,137,0.35) 0 34px, transparent 35px), repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 40px), repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 40px)"><svg width="34" height="34" viewBox="0 0 24 24" fill="#CAA189" aria-hidden="true" style="position: absolute; left: calc(50% - 17px); top: calc(42% - 30px)"><path d="M12 22s-7-6.3-7-12a7 7 0 0 1 14 0c0 5.7-7 12-7 12zm0-9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg><span style="font-family: 'Crimson Pro', serif; font-size: 26px">LVS Mall on Google Maps</span><span style="font-size: 14px; color: #CAA189">New Airport Road, Chikkajala, Bengaluru 562157 · Open map →</span></a>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px">
<div style="border: 1px solid #3A5170; padding: 24px; display: flex; flex-direction: column; gap: 10px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#CAA189" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14M6 17l1.5-5h9L18 17M7 17v2M17 17v2M8.5 12l1-3h5l1 3"/></svg><span style="font-size: 17px; font-weight: 600">By car</span><span style="font-size: 14px; line-height: 1.6; color: #C9CFD8">Take New Airport Road towards the airport. Park right outside your store.</span></div>
<div style="border: 1px solid #3A5170; padding: 24px; display: flex; flex-direction: column; gap: 10px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#CAA189" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14l18-6-2-2-6 2-5-3-2 1 3 4-4 1.5-2-1-1 .5 1 3z"/></svg><span style="font-size: 17px; font-weight: 600">From the airport</span><span style="font-size: 14px; line-height: 1.6; color: #C9CFD8">Head towards the city on New Airport Road — LVS Mall is at Chikkajala.</span></div>
<div style="border: 1px solid #3A5170; padding: 24px; display: flex; flex-direction: column; gap: 10px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#CAA189" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span style="font-size: 17px; font-weight: 600">By cab</span><span style="font-size: 14px; line-height: 1.6; color: #C9CFD8">Search "LVS Mall, Chikkajala" in your cab app for drop-off at the front.</span></div>
</div>
</div>
</section>

<section id="faq" style="padding: 96px 0">
<div class="wrap" style="display: flex; flex-wrap: wrap; gap: 56px">
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px"><span style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #8B6347">Help</span><h2 style="margin: 0; font-family: 'Crimson Pro', serif; font-weight: 400; font-size: 56px; line-height: 1">Frequently asked questions</h2></div>
<div style="flex: 2 1 560px; min-width: 0; display: flex; flex-direction: column; border-top: 1px solid #E6DDD2">
